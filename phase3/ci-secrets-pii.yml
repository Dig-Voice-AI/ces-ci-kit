name: CI secrets + PII (Phase 3)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-secrets-pii-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  scan:
    name: Secrets + PII in new changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # If the repo has a symlink that can't be materialized on Linux (e.g.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Work out which commits to scan
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"   # manual run: just the latest commit
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Scanning $base...HEAD"
      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz && ./gitleaks version
      - name: Secret scan (new commits only)
        run: |
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="${{ steps.range.outputs.base }}..HEAD" .
      - name: Secret scan (text inside new Word/Excel/PowerPoint files)
        if: always()
        run: |
          python scripts/ci/extract_office_text.py "${{ steps.range.outputs.base }}" HEAD "$RUNNER_TEMP/office"
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose "$RUNNER_TEMP/office"
      - name: PII scan (added lines only)
        if: always()
        run: python scripts/ci/check_pii_diff.py --base "${{ steps.range.outputs.base }}" --head HEAD
