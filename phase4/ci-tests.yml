name: CI tests (Phase 4 - unit tests + ratchet)

# Runs the offline unit tests in testcases/ and compares failures to
# scripts/ci/test_baseline.json. Only NEW failures (or a test file that can't
# load) turn this red. Needs no secrets, no GCP, no live endpoints.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # non-blocking for now; Phase 5 makes it required
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Belt and braces: make sure nothing can pick up cloud credentials.
      GOOGLE_APPLICATION_CREDENTIALS: ""
      CLOUDSDK_CONFIG: /tmp/no-gcloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        # If the repo has a symlink that can't be materialized on Linux (e.g.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/ci/requirements-tests.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r scripts/ci/requirements-tests.txt
      - name: Run tests and compare to baseline
        run: python scripts/ci/test_ratchet.py --out "$RUNNER_TEMP/junit.xml" --timeout 600
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-unit-tests
          path: ${{ runner.temp }}/junit.xml
          retention-days: 14
          if-no-files-found: warn
