name: CI basic (Phase 1)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-basic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python compiles + JSON parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Compile every tracked Python file
        run: |
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile
          echo "Compiled $(git ls-files '*.py' | wc -l) Python files"

      - name: Parse every tracked JSON file
        run: |
          python - <<'PY'
          import json, subprocess, sys
          def esc_data(s: str) -> str:
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def esc_prop(s: str) -> str:
              return esc_data(s).replace(":", "%3A").replace(",", "%2C")
          out = subprocess.run(["git", "ls-files", "-z", "*.json"],
                               capture_output=True, text=True, check=True).stdout
          files = [f for f in out.split("\0") if f]
          bad = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      json.load(fh)
              except Exception as e:
                  bad += 1
                  print(f"::error file={esc_prop(f)},title=JSON syntax::{esc_data(str(e))}")
          print(f"Parsed {len(files)} JSON files, {bad} failed")
          sys.exit(1 if bad else 0)
          PY
