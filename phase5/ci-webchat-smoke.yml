name: CI webchat smoke (Phase 5 - live, public HTTP)

# Hits the public DEV webchat-widget Cloud Run URL (/health and /) to confirm
# it is up and serving no-cache headers. Public HTTP only: no secrets, no GCP.
# Deliberately NOT run on pull requests (a live outage shouldn't redden PRs).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # nightly, ~05:17/06:17 America/Chicago
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-webchat-smoke
  cancel-in-progress: true

jobs:
  webchat-smoke:
    name: Webchat widget live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # non-blocking
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GOOGLE_APPLICATION_CREDENTIALS: ""
      CLOUDSDK_CONFIG: /tmp/no-gcloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest==9.2.0
      - name: Live webchat smoke tests
        run: >-
          python -m pytest -v -p no:cacheprovider
          "testcases/chat/test_webchat_widget.py::TestWebchatWidget::test_live_health_endpoint"
          "testcases/chat/test_webchat_widget.py::TestWebchatWidget::test_live_index_endpoint_and_headers"
