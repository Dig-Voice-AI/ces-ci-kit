name: CI SCRAPI audit (Phase 5 - offline, non-blocking)
# Offline lint of the committed CES export with Google's cxas-scrapi.
# No cloud credentials. Fails only on findings not in the reviewed
# false-positive baseline. Make it a required check only after it has
# been green for a while.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-scrapi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scrapi:
    name: SCRAPI audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # non-blocking for now
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-scrapi.txt
      - run: python -m pip install -r requirements-scrapi.txt
      - name: SCRAPI lint vs reviewed false-positive baseline
        run: python scripts/ci/run_scrapi_audit.py --config scrapi-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scrapi-findings
          path: audit-output/
          if-no-files-found: warn
