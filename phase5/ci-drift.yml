name: CI drift check (Phase 5 - live DEV, read-only)

# Compares what is LIVE in DEV (the CES app + the listed Cloud Run services)
# with what the repo says, and writes the differences to the job summary.
# Signs in with Workload Identity Federation as ci-readonly (custom role
# ciConfigReader: get/list on app config only, no export, no conversations;
# run.viewer on the listed services only). No stored key.
# Reports field paths and env var NAMES only, never values.
# Not run on pull requests: live drift shouldn't redden a PR, and PRs from
# forks can't mint the OIDC token anyway.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * *'   # nightly, ~05:41/06:41 America/Chicago
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job request a GitHub OIDC token for WIF

concurrency:
  group: ci-drift
  cancel-in-progress: true

jobs:
  drift:
    name: DEV live drift report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # non-blocking: a report, not a gate
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - id: auth
        name: Sign in to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-ci/providers/<PROVIDER_ID>
          service_account: ci-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
      - name: Drift check (stdlib only, GET requests only)
        env:
          DRIFT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/ci/check_drift.py
