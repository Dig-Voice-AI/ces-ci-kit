name: CES deploy DEV (Phase 5 - manual, approval-gated)

# Manual only. Every run waits for the repo owner's approval in the GitHub environment
# (one approval per deploy). DEV app only; PROD is never touched here.
#
#   job 1 (environment: dev)      scoped sync.py --only <slugs> -> deploy.py
#                                 --deployment <TEST_DEPLOYMENT_ID> (test deployment only)
#   job 2 (environment: dev-live) only if target=dev-live, needs a SECOND
#                                 approval: repoints the live deployment <LIVE_DEPLOYMENT_ID> to the
#                                 exact version job 1 cut and verified.
#
# Never a full sync: `only` is required and validated. Note: cutting a version
# snapshots the WHOLE shared draft (everyone's in-flight edits): announce first.
# Auth: WIF as ci-deployer (custom role ciDeployer: config read + update
# existing agents, create app versions, update deployments; no create/delete,
# no export/import, no conversations). The SA trusts only jobs running in the
# dev / dev-live environments, which only allow the main branch. No stored key.
# Rollback: the job log prints ROLLBACK with the previous version id.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Agent slugs to sync, comma-separated (REQUIRED; never a full sync)'
        required: true
        type: string
      mode:
        description: 'What to patch on those agents'
        required: true
        default: agent
        type: choice
        options: [agent, callbacks-only, transfer-rules-only, children-only]
      target:
        description: 'test-widget (<TEST_DEPLOYMENT_ID>) or also dev-live (<LIVE_DEPLOYMENT_ID>, second approval)'
        required: true
        default: test-widget
        type: choice
        options: [test-widget, dev-live]
      label:
        description: 'Version label (default: ci-<short sha>)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ces-dev-deploy
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  GCP_PROJECT_ID: <GCP_PROJECT_ID>
  GCP_REGION: us
  CES_APP_ID: <CES_APP_ID>
  TEST_WIDGET: <TEST_DEPLOYMENT_ID>
  DEV_LIVE: <LIVE_DEPLOYMENT_ID>

jobs:
  test-widget:
    name: Sync + deploy to test widget
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate inputs (scoped only, no full sync)
        env:
          ONLY: ${{ inputs.only }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          only="$(echo "$ONLY" | tr -d '[:space:]')"
          if [ -z "$only" ] || [[ ",${only,,}," == *",all,"* ]] || [[ "$only" == *"*"* ]]; then
            echo "::error::'only' must list agent slugs; a full sync is not allowed"; exit 1
          fi
          if ! [[ "$only" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::'only' must be comma-separated slugs (a-z, 0-9, -)"; exit 1
          fi
          if [ -n "$LABEL" ] && ! [[ "$LABEL" =~ ^[A-Za-z0-9._:-]{1,60}$ ]]; then
            echo "::error::label may only use letters, digits, . _ : - (max 60)"; exit 1
          fi
          echo "ONLY=$only" >> "$GITHUB_ENV"
          echo "LABEL=${LABEL:-ci-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: Sign in to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-ci/providers/<PROVIDER_ID>
          service_account: ci-deployer@<GCP_PROJECT_ID>.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Scoped sync to the DEV draft
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          flag=""
          case "$MODE" in
            agent) flag="" ;;
            callbacks-only|transfer-rules-only|children-only) flag="--$MODE" ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac
          python scripts/sync.py --only "$ONLY" $flag
      - name: Cut version + repoint test widget only
        run: python scripts/deploy.py --label "$LABEL" --desc "CI deploy $GITHUB_SHA (only=$ONLY)" --deployment "$TEST_WIDGET"
      - id: version
        name: Record the version the test widget now serves
        env:
          MODE: ${{ inputs.mode }}
        run: |
          v=$(python - <<'PY'
          import os, sys
          sys.path.insert(0, os.environ.get("CES_TOOLS_DIR", "scripts"))
          from ces_client import CES, short
          print(short(CES().get("deployments", os.environ["TEST_WIDGET"]).get("appVersion", "")))
          PY
          )
          echo "version=$v" >> "$GITHUB_OUTPUT"
          {
            echo "## DEV deploy (test widget)"
            echo "- scope: \`$ONLY\` ($MODE)"
            echo "- version: \`$v\` (label \`$LABEL\`)"
            echo "- Capture after deploy: \`python scripts/export.py --out envs/dev\` and open a PR."
          } >> "$GITHUB_STEP_SUMMARY"

  dev-live:
    name: Repoint live deployment to the same version
    needs: test-widget
    if: inputs.target == 'dev-live' && needs.test-widget.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Sign in to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-ci/providers/<PROVIDER_ID>
          service_account: ci-deployer@<GCP_PROJECT_ID>.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Repoint live deployment (no new version cut)
        env:
          VERSION: ${{ needs.test-widget.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad version id"; exit 1; }
          python scripts/deploy.py --rollback "$VERSION" --deployment "$DEV_LIVE"
          echo "## live deployment repointed to \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
